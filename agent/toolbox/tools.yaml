# MCP Toolbox for Databases config (format for Toolbox v1.x: one YAML document per
# source / tool / toolset). Deployed to Cloud Run by deploy.sh as the secret "tools".
# Read-only and limited to the a4i_econ dataset: the agent can only run the SQL below.
# The project comes from the GOOGLE_CLOUD_PROJECT environment variable (set by the deploy
# pipeline / deploy.sh). Tables are written dataset.table, which BigQuery resolves
# against that same project, so no project ID is stored in this repo.
kind: source
name: bq
type: bigquery
project: ${GOOGLE_CLOUD_PROJECT}
location: US
readOnly: true
allowedDatasets:
  - a4i_econ
---
kind: tool
name: list_applications
type: bigquery-sql
source: bq
description: List every grant application with business name, address, amount requested and hardship.
statement: |
  SELECT a.application_id, a.business_id, b.name, b.address, b.naics4,
         a.requested_amount, a.revenue_drop_pct, a.months_cash_on_hand,
         a.self_reported_employees, a.hardship_note
  FROM `a4i_econ.applications` a
  JOIN `a4i_econ.businesses` b USING (business_id)
  ORDER BY a.application_id
---
kind: tool
name: find_business
type: bigquery-sql
source: bq
description: Find businesses in the corridor whose name contains the search text. Returns business_id.
parameters:
  - name: name_contains
    type: string
    description: Part of the business name, case-insensitive.
statement: |
  SELECT business_id, name, address, naics4
  FROM `a4i_econ.businesses`
  WHERE LOWER(name) LIKE CONCAT('%', LOWER(@name_contains), '%')
  LIMIT 10
---
kind: tool
name: loan_history
type: bigquery-sql
source: bq
description: Real SBA 7(a) loans for a business, including whether any were charged off (the business failed to repay).
parameters:
  - name: business_id
    type: string
    description: The business_id.
statement: |
  SELECT bank_name, gross_approval, approval_date, loan_status, charged_off
  FROM `a4i_econ.borrowed_from`
  WHERE business_id = @business_id
---
kind: tool
name: tract_profile
type: bigquery-sql
source: bq
description: Census tract demographics (poverty, vehicle access, public assistance, median income) for a business's location.
parameters:
  - name: business_id
    type: string
    description: The business_id.
statement: |
  SELECT geo_id, poverty_rate, no_vehicle_rate, assistance_rate, median_income
  FROM `a4i_econ.business_tract`
  WHERE business_id = @business_id
---
kind: toolset
name: grant_toolset
tools:
  - list_applications
  - find_business
  - loan_history
  - tract_profile
